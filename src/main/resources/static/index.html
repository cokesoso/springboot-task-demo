<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务管理 - Demo</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>任务管理系统</h1>
      <p id="headerSubtitle">邮箱注册登录 · JWT 身份验证 · MongoDB 持久化</p>
    </header>

    <section id="authSection" class="auth-section">
      <div class="grid">
        <article class="card">
          <h2><span>📝</span> 注册</h2>
          <form id="registerForm">
            <div class="form-group">
              <label for="regEmail">邮箱</label>
              <input type="email" id="regEmail" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="regPassword">密码</label>
              <input type="password" id="regPassword" placeholder="至少 6 位" autocomplete="new-password" required>
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
          </form>
        </article>

        <article class="card">
          <h2><span>🔐</span> 登录</h2>
          <form id="loginForm">
            <div class="form-group">
              <label for="loginEmail">邮箱</label>
              <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email" required>
            </div>
            <div class="form-group">
              <label for="loginPassword">密码</label>
              <input type="password" id="loginPassword" placeholder="请输入密码" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary">登录</button>
          </form>
        </article>
      </div>
    </section>

    <section id="appSection" class="app-section" hidden>
      <div class="toolbar card">
        <div>
          <span class="user-label">当前用户</span>
          <strong id="userEmail"></strong>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm">退出登录</button>
      </div>

      <article class="card task-form-card">
        <h2 id="taskFormTitle"><span>➕</span> 新建任务</h2>
        <form id="taskForm">
          <input type="hidden" id="taskId">
          <div class="form-group">
            <label for="taskTitle">标题</label>
            <input type="text" id="taskTitle" placeholder="任务标题" required>
          </div>
          <div class="form-group">
            <label for="taskDescription">描述</label>
            <textarea id="taskDescription" rows="3" placeholder="任务描述（可选）"></textarea>
          </div>
          <div class="form-group">
            <label for="taskDueDate">截止日期</label>
            <input type="date" id="taskDueDate">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="taskSubmitBtn">创建任务</button>
            <button type="button" class="btn btn-secondary btn-sm" id="cancelEditBtn" hidden>取消编辑</button>
          </div>
        </form>
      </article>

      <article class="card tasks-section">
        <div class="tasks-header">
          <h2><span>📋</span> 我的任务</h2>
          <div class="tasks-controls">
            <select id="statusFilter" class="filter-select" aria-label="筛选状态">
              <option value="all">全部</option>
              <option value="pending">未完成</option>
              <option value="completed">已完成</option>
            </select>
            <button type="button" id="refreshBtn" class="btn btn-secondary btn-sm">刷新</button>
          </div>
        </div>
        <ul id="taskList" class="task-list"></ul>
        <p id="emptyState" class="empty-state" hidden>暂无任务，创建一条吧</p>
      </article>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/js/app.js"></script>
</body>
</html>
